name: Build Android now-playing reporter

on:
  workflow_dispatch:
  push:
    paths:
      - "android-now-playing/**"
      - ".github/workflows/build-android-now-playing.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-now-playing
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netease-now-playing-reporter-debug
          path: android-now-playing/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
